[project]
name = "heimdall"
version = "0.1.0"
description = "Heimdall: an OpenTelemetry-native observability engine"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.159.1",
    "mcp>=2.3.0",
    "opentelemetry-proto>=1.45.1",
    "protobuf>=7.36.2",
    "pyarrow>=26.0.0",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heimdall"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
